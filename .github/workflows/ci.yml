name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Secret scan
    # gitleaks-action scans from the first pushed commit's parent, which fails on a repo's
    # first push (the root commit has none). That push is scanned locally before publishing.
    if: github.event_name != 'push' || github.event.before != '0000000000000000000000000000000000000000'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Lint, types, static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: dholman7/agent-eval-gate
          path: agent-eval-gate
      - uses: actions/checkout@v7
        with:
          repository: dholman7/vendor-intake-app
          path: vendor-intake-app
          # Only the result files: the app's own TypeScript would otherwise be linted and
          # type-checked as part of this site.
          sparse-checkout: backend/evals/extraction/results
      # The red teams' published results, nothing else (see lib/attacks.ts).
      - uses: actions/checkout@v7
        with:
          repository: dholman7/ci-context-mcp
          path: ci-context-mcp
          sparse-checkout: redteam/results
      - uses: actions/checkout@v7
        with:
          repository: dholman7/agent-dev-skills
          path: agent-dev-skills
          sparse-checkout: evals/review/attacks
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
        env:
          AEG_REPO: ${{ github.workspace }}/agent-eval-gate
          EXTRACTION_REPO: ${{ github.workspace }}/vendor-intake-app
          CI_CONTEXT_REPO: ${{ github.workspace }}/ci-context-mcp
          REVIEW_REPO: ${{ github.workspace }}/agent-dev-skills
